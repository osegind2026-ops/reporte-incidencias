<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#691C32">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Incidencias SI">
  <title>Incidencias SI · Celular</title>
  <link rel="icon" href="../img/incidencias.ico">
  <link rel="apple-touch-icon" href="../img/incidencias_256.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/inc.css">
  <style>
    body { background: var(--fondo); }
    .mv { max-width: 560px; margin: 0 auto; padding: 0 12px calc(78px + env(safe-area-inset-bottom)); }
    .mv-top { position: sticky; top: 0; z-index: 10; background: var(--guinda); color: #fff; margin: 0 -12px 12px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
    .mv-top b { font-size: 16px; } .mv-top .mini { color: rgba(255,255,255,.75); }
    .mv-top button { margin-left: auto; background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 99px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 600; }
    .mv-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid var(--borde); display: flex; padding-bottom: env(safe-area-inset-bottom); }
    .mv-nav button { flex: 1; border: 0; background: none; padding: 9px 2px 8px; font: inherit; font-size: 11px; color: var(--texto-3); display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .mv-nav button svg { width: 22px; height: 22px; }
    .mv-nav button.on { color: var(--guinda); font-weight: 700; }
    .mv-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .mv-kpis .tarjeta { margin: 0; padding: 14px; }
    .mv-kpis .valor { font-size: 26px; }
    .mv .tarjeta { padding: 16px; }
    .mv .item { margin-bottom: 8px; }
    .mv-acc { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .mv-login { max-width: 400px; margin: 0 auto; padding: 18px 16px 30px; }
    .mv-tipos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .mv-buscar { margin-bottom: 10px; }
    .toasts { left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <div class="cargando"><div class="giro"></div></div>
  <div id="raiz"></div>
  <script src="../js/arranque.js"></script>
  <script src="../config.js"></script>
  <script src="../js/nucleo.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/qr.js"></script>
  <script src="../js/movil.js"></script>
</body>
</html>
