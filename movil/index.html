<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#691C32">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Incidencias SI">
  <title>Incidencias SI · Seguridad Industrial</title>
  <link rel="icon" href="../img/incidencias.ico">
  <link rel="apple-touch-icon" href="../img/incidencias_256.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/inc.css">
  <style>
    /* app web: mismas pantallas que la PC (js/web.js), ajustes para el celular */
    body { padding-bottom: env(safe-area-inset-bottom); }
    .barra { padding-top: calc(10px + env(safe-area-inset-top)); }
    #wFecha { font-size: 11.5px; white-space: nowrap; }
    #wFecha svg { width: 14px; height: 14px; }
    img.web-cargando { background: linear-gradient(90deg, #EFEAE6, #F7F4F1, #EFEAE6); background-size: 200% 100%; animation: webBrillo 1.2s linear infinite; min-width: 40px; min-height: 40px; }
    img.web-sinfoto { background: #EFEAE6; min-width: 40px; min-height: 40px; }
    @keyframes webBrillo { to { background-position: -200% 0; } }
    @media (max-width: 640px) {
      /* encabezado en un solo renglon: menu, titulo (recortado) y botones solo con icono */
      .barra { flex-wrap: nowrap; gap: 8px; padding-left: 10px; padding-right: 10px; }
      .barra > div:not(.barra-der) { flex: 1; min-width: 0; }
      .barra h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .barra .sub { display: none; }
      .barra-der { flex: none; margin-left: auto; gap: 6px; }
      #wFecha span { display: none; }
      #wFecha, #bLink { padding: 8px 9px; gap: 0; }
      #bLink { font-size: 0; }
      #bLink svg { width: 18px; height: 18px; margin: 0; }
      .barra .avatar { width: 34px; height: 34px; font-size: 11px; }
      /* nada mas ancho que la pantalla: etiquetas que se acomodan y renglones de captura en una columna */
      .badge, .chips span { white-space: normal; max-width: 100%; }
      .editor-fila { grid-template-columns: minmax(0, 1fr) !important; }
      .editor-fila > * { grid-column: auto !important; min-width: 0; }
      #vista input, #vista select, #vista textarea { max-width: 100%; min-width: 0; }
      #vista .grid2, #vista .grid3 { grid-template-columns: minmax(0, 1fr) !important; }
      #vista table { display: block; max-width: 100%; overflow-x: auto; }
      .login { padding: 18px 14px; }
      .menu-usuario { right: 10px; left: 10px; width: auto; }
      .toasts { left: 12px; right: 12px; }
      .cuadricula > .kpi.c3 { grid-column: span 6; padding: 14px; }
      .cuadricula > .kpi.c3 .valor { font-size: 26px; }
      .cuadricula { gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="cargando"><div class="giro"></div></div>
  <div id="raiz"></div>
  <script src="../js/arranque.js"></script>
  <script src="../config.js"></script>
  <script src="../js/gzip.js"></script>
  <script src="../js/web.js"></script>
</body>
</html>
